# 경고(Pitfall 4): 이 워크플로는 backend/** 경로 필터가 걸려 있다. 이 워크플로를
# 브랜치 보호 규칙의 "필수 상태 체크"로 등록하면, 클라이언트(Expo)만 변경한 PR에서는
# 워크플로 자체가 실행되지 않아 "체크 대기 중" 상태로 영원히 머무르며 머지가 막힐 수
# 있다. GitHub은 경로 필터로 스킵된 워크플로를 "통과"가 아니라 "아직 실행 안 됨"으로
# 취급하기 때문이다. 따라서 이번 phase 스코프에서는 이 워크플로를 필수 체크로 등록하지
# 않는다. 등록이 필요해지면 paths-ignore 없이 항상 실행되는 wrapper job 패턴을 검토한다.
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon
