# 공통 프로파일 — local/staging 모두에 적용되는 기본값
spring:
  application:
    name: backend
  jpa:
    hibernate:
      # Flyway가 스키마의 유일한 소유자다 — JPA는 엔티티↔실제 테이블 일치 여부를
      # 검증만 하고 절대 DDL을 실행하지 않는다(update/create/create-drop 금지, T-9-03).
      ddl-auto: validate
    # 트랜잭션 종료 후에도 지연 로딩을 열어두는 Open Session In View 패턴을 끈다 —
    # 컨트롤러 계층에서 예기치 않은 추가 쿼리가 발생하는 것을 방지한다.
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        # actuator는 health만 노출한다 — env/beans/heapdump 등은 절대 열지 않는다(T-9-02).
        include: health
jwt:
  issuer: footlog-backend
  # D-03(TTL): access는 15분~1시간 범위 안에서 30분을 선택.
  access-token-ttl: PT30M
  # D-03(TTL): refresh는 30일.
  refresh-token-ttl: P30D
  # (a) 이 기본값은 로컬 개발과 테스트 전용이며 비밀값이 아니다 — 어떤 실제 토큰도 이 키로
  #     서명되어서는 안 된다. (b) 기본값을 공통 프로파일에 둔 이유: 이 저장소의 통합 테스트들은
  #     활성 프로파일 없이(@SpringBootTest 단독) 돌기 때문에 로컬 프로파일에만 기본값을 두면
  #     테스트 컨텍스트가 기동되지 않는다(10-RESEARCH.md Open Questions #3의 절충안을 이 제약에
  #     맞춰 조정한 것). (c) staging은 application-staging.yml이 이 값을 기본값 없는
  #     ${JWT_SECRET}으로 덮어쓰므로, 환경변수가 없으면 기동 자체가 실패한다 — 즉 이
  #     플레이스홀더가 배포 환경으로 새어 나갈 경로가 없다(D-11 계승).
  secret: ${JWT_SECRET:local-and-test-only-insecure-placeholder-do-not-use-in-production}
